<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Selector</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cabecera">
    <div class="badge-icono">
      <ion-icon name="list-outline"></ion-icon>
    </div>
    <div class="cabecera-texto">
      <ion-chip color="tertiary" outline="true">ion-select</ion-chip>
    </div>
  </div>

  <div class="ion-padding">
    <div class="bloque-info">
      <h3>¿Para qué sirve?</h3>
      <p>Muestra una lista desplegable para elegir una opción entre varias, ahorrando espacio en pantalla.</p>
    </div>

    <h3 class="titulo-demo">Ejemplo en vivo</h3>
    <div class="caja-demo">
      <ion-item>
      <ion-select label="País" placeholder="Selecciona">
        <ion-select-option value="co">Colombia</ion-select-option>
        <ion-select-option value="mx">México</ion-select-option>
        <ion-select-option value="ar">Argentina</ion-select-option>
      </ion-select>
    </ion-item>
    </div>
  </div>
</ion-content>
