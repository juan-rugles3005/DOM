<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Acordeón</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cabecera">
    <div class="badge-icono">
      <ion-icon name="chevron-down-circle-outline"></ion-icon>
    </div>
    <div class="cabecera-texto">
      <ion-chip color="tertiary" outline="true">ion-accordion</ion-chip>
    </div>
  </div>

  <div class="ion-padding">
    <div class="bloque-info">
      <h3>¿Para qué sirve?</h3>
      <p>Organiza contenido en secciones que se expanden o contraen, ahorrando espacio en pantalla.</p>
    </div>

    <h3 class="titulo-demo">Ejemplo en vivo</h3>
    <div class="caja-demo">
      <ion-accordion-group>
      <ion-accordion value="primero">
        <ion-item slot="header" color="light"><ion-label>Primera sección</ion-label></ion-item>
        <div class="ion-padding" slot="content">Contenido de la primera sección.</div>
      </ion-accordion>
    </ion-accordion-group>
    </div>
  </div>
</ion-content>
