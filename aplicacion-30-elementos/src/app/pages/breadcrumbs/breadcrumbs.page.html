<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Migas de pan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cabecera">
    <div class="badge-icono">
      <ion-icon name="navigate-outline"></ion-icon>
    </div>
    <div class="cabecera-texto">
      <ion-chip color="tertiary" outline="true">ion-breadcrumbs</ion-chip>
    </div>
  </div>

  <div class="ion-padding">
    <div class="bloque-info">
      <h3>¿Para qué sirve?</h3>
      <p>Muestra la ruta de navegación actual dentro de la app, ayudando al usuario a saber en qué sección está.</p>
    </div>

    <h3 class="titulo-demo">Ejemplo en vivo</h3>
    <div class="caja-demo">
      <ion-breadcrumbs>
      <ion-breadcrumb>Inicio</ion-breadcrumb>
      <ion-breadcrumb>Productos</ion-breadcrumb>
      <ion-breadcrumb>Detalle</ion-breadcrumb>
    </ion-breadcrumbs>
    </div>
  </div>
</ion-content>
