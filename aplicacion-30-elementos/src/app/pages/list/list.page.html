<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Lista</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cabecera">
    <div class="badge-icono">
      <ion-icon name="reorder-four-outline"></ion-icon>
    </div>
    <div class="cabecera-texto">
      <ion-chip color="tertiary" outline="true">ion-list</ion-chip>
    </div>
  </div>

  <div class="ion-padding">
    <div class="bloque-info">
      <h3>¿Para qué sirve?</h3>
      <p>Muestra varios elementos organizados en filas, ideal para menús, contactos o listados de datos.</p>
    </div>

    <h3 class="titulo-demo">Ejemplo en vivo</h3>
    <div class="caja-demo">
      <ion-list>
      <ion-item><ion-label>Elemento 1</ion-label></ion-item>
      <ion-item><ion-label>Elemento 2</ion-label></ion-item>
      <ion-item><ion-label>Elemento 3</ion-label></ion-item>
    </ion-list>
    </div>
  </div>
</ion-content>
