<div class="calculadora">
  <div>
    <label>Num1</label>
    <input type="number" [(ngModel)]="num1" />
  </div>

  <div>
    <label>Op.</label>
    <select [(ngModel)]="operador">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
      <option value="^">^</option>
    </select>
  </div>

  <div>
    <label>Num2</label>
    <input type="number" [(ngModel)]="num2" />
  </div>

  <button (click)="operar()">Operar</button>

  <p>Resultado = {{ resultado }}</p>

  <div class="historial" *ngIf="historial.length > 0">
    <h3>Historial</h3>
    <ul>
      <li *ngFor="let item of historial">{{ item }}</li>
    </ul>
    <button (click)="borrarHistorial()">Borrar historial</button>
  </div>
</div>
